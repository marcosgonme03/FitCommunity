<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="FitCommunity — Tu app de gimnasio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="55%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.7">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.85" r="0.55">
      <stop offset="0%" stop-color="#eab308" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#eab308" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>
  <rect width="1280" height="360" fill="url(#glow2)"/>

  <g transform="translate(64, 92)">
    <!-- Logo box -->
    <g filter="url(#shadow)">
      <rect width="92" height="92" rx="22" fill="url(#logoGrad)"/>
      <text x="46" y="62" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="800" font-size="46" fill="#fff" text-anchor="middle" letter-spacing="-1">FC</text>
    </g>

    <!-- Brand text -->
    <g transform="translate(116, 18)">
      <text font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="800" font-size="44" fill="#ffffff" letter-spacing="-1">FitCommunity</text>
      <text y="34" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#fdba74" letter-spacing="3">TU APP DE GIMNASIO · TFG · MAYO 2026</text>
    </g>
  </g>

  <!-- Tagline -->
  <g transform="translate(64, 222)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="800" font-size="38" fill="#ffffff" letter-spacing="-1">
      Entrena.  Progresa.  <tspan fill="url(#accent)">Comparte.</tspan>
    </text>
    <text y="38" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="500" font-size="16" fill="#d6d3d1">
      Plataforma social de fitness con Coach IA, generación de rutinas, análisis de progreso y planes nutricionales.
    </text>
  </g>

  <!-- Right-side feature pills -->
  <g transform="translate(700, 100)" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <g transform="translate(0, 0)">
      <rect width="240" height="48" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <circle cx="26" cy="24" r="9" fill="#fb923c"/>
      <text x="48" y="30" fill="#fff" font-size="14" font-weight="700">Coach IA personalizado</text>
    </g>
    <g transform="translate(260, 0)">
      <rect width="240" height="48" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <circle cx="26" cy="24" r="9" fill="#facc15"/>
      <text x="48" y="30" fill="#fff" font-size="14" font-weight="700">Heatmap anual de actividad</text>
    </g>
    <g transform="translate(0, 60)">
      <rect width="240" height="48" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <circle cx="26" cy="24" r="9" fill="#fb923c"/>
      <text x="48" y="30" fill="#fff" font-size="14" font-weight="700">Modo entrenamiento en vivo</text>
    </g>
    <g transform="translate(260, 60)">
      <rect width="240" height="48" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <circle cx="26" cy="24" r="9" fill="#facc15"/>
      <text x="48" y="30" fill="#fff" font-size="14" font-weight="700">Suscripciones Premium</text>
    </g>
    <g transform="translate(0, 120)">
      <rect width="240" height="48" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <circle cx="26" cy="24" r="9" fill="#fb923c"/>
      <text x="48" y="30" fill="#fff" font-size="14" font-weight="700">Panel admin con KPIs en vivo</text>
    </g>
    <g transform="translate(260, 120)">
      <rect width="240" height="48" rx="24" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
      <circle cx="26" cy="24" r="9" fill="#facc15"/>
      <text x="48" y="30" fill="#fff" font-size="14" font-weight="700">Export PDF de rutinas y dietas</text>
    </g>
  </g>

  <!-- Decorative chart at bottom-right -->
  <g transform="translate(1080, 300)" opacity="0.6">
    <rect x="0" y="-12" width="6" height="12" rx="1" fill="#fb923c"/>
    <rect x="10" y="-26" width="6" height="26" rx="1" fill="#fb923c"/>
    <rect x="20" y="-18" width="6" height="18" rx="1" fill="#fb923c"/>
    <rect x="30" y="-44" width="6" height="44" rx="1" fill="#fb923c"/>
    <rect x="40" y="-32" width="6" height="32" rx="1" fill="#fb923c"/>
    <rect x="50" y="-58" width="6" height="58" rx="1" fill="#fb923c"/>
    <rect x="60" y="-40" width="6" height="40" rx="1" fill="#fb923c"/>
    <rect x="70" y="-72" width="6" height="72" rx="1" fill="#facc15"/>
  </g>

  <!-- Footer accent line -->
  <rect x="0" y="354" width="1280" height="6" fill="url(#accent)"/>
</svg>

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. BACKEND — Lint + Type-check + Tests
  # ───────────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (lint · typecheck · test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend

    env:
      # Minimum env vars required by config/index.ts (no real services needed)
      NODE_ENV: test
      PORT: 3001
      FRONTEND_URL: http://localhost:5174
      API_URL: http://localhost:3001
      DATABASE_URL: postgresql://test:test@localhost:5432/fitcommunity_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_access_secret_that_is_at_least_64_characters_long_for_github_actions
      JWT_REFRESH_SECRET: ci_refresh_secret_that_is_at_least_64_characters_long_for_github_actions
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      BCRYPT_SALT_ROUNDS: 10
      LOG_LEVEL: error
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      AUTH_RATE_LIMIT_MAX: 20
      SMTP_HOST: smtp.mailtrap.io
      SMTP_PORT: 587
      TOTP_APP_NAME: FitCommunity

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Generate Prisma client
        run: pnpm --filter backend db:generate

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm test --coverage --ci

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # 2. FRONTEND — Lint + Type-check + Build
  # ───────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (lint · typecheck · build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/frontend

    env:
      VITE_API_URL: /api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

  # ───────────────────────────────────────────────────────────────────────────
  # 3. Summary — required for branch protection rules
  # ───────────────────────────────────────────────────────────────────────────
  ci-ok:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ needs.backend.result }}" != "success" || "${{ needs.frontend.result }}" != "success" ]]; then
            echo "❌ One or more CI jobs failed"
            exit 1
          fi
          echo "✅ All CI jobs passed"
